<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Data from Quorum</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        img {
            border-radius: 50%;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>Senator Data from Quorum</h2>
    <button onclick="fetchData()">Fetch Data from Quorum</button>

    <table id="dataTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>State</th>
                <th>Party</th>
                <th>Status</th>
                <th>Photo</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be inserted here dynamically -->
        </tbody>
    </table>

    <script>
        async function fetchData() {
            try {
                console.log("Fetching data from API...");

                const response = await fetch('http://localhost:8080/fetch/store-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const result = await response.json();
                console.log("API Response:", result);

                if (!result.info || !Array.isArray(result.info)) {
                    throw new Error("Invalid response format: 'info' is missing or not an array");
                }

                // Extract senator data from response
                const senatorData = result.info.map(item => {
                    return item.updateOne?.update?.$set || item; // Extract actual data if wrapped in updateOne
                });

                const tableBody = document.querySelector("#dataTable tbody");
                tableBody.innerHTML = ""; // Clear previous data

                senatorData.forEach(senator => {
                    const row = `<tr>
                        <td>${senator.name}</td>
                        <td>${senator.state}</td>
                        <td>${senator.party}</td>
                        <td>${senator.status}</td>
                        <td><img src="${senator.photo}" alt="Photo" width="50"></td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });

            } catch (error) {
                console.error("Error fetching data:", error);
                alert(`Failed to fetch data: ${error.message}`);
            }
        }
    </script>

</body>
</html>
